[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.95"
license = "Proprietary"
authors = ["Halkyon Studios"]

[workspace.dependencies]
ggr_core = { path = "crates/ggr_core" }
ggr_content = { path = "crates/ggr_content" }
ggr_sim = { path = "crates/ggr_sim" }
ggr_save = { path = "crates/ggr_save" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
directories = "6"
bevy = "0.19.1"
bevy_egui = "0.42.0"

# Bevy is unplayably slow unoptimised; dependencies are optimised even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 4
