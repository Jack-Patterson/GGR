  class.fighter: Fighter
  class.fighter.desc: Hits things until they stop. A solid foundation.
  class.rogue: Rogue
  class.rogue.desc: Quick hands, quicker feet.
  class.mage: Mage
  class.mage.desc: Reads the books other people are afraid of.
  class.holy: Acolyte
  class.holy.desc: Keeps people alive, and occasionally convinced.
  class.swordsman: Swordsman
  class.swordsman.desc: The blade as a discipline rather than a habit.
  class.guardian: Guardian
  class.guardian.desc: Stands between the party and whatever wants it dead.
  class.ranger: Ranger
  class.ranger.desc: Sees the ambush before the ambush sees them.
  class.assassin: Assassin
  class.assassin.desc: Finishes fights before the other side has started them.
  class.elementalist: Elementalist
  class.elementalist.desc: Fire, frost and a great deal of paperwork.
  class.enchanter: Enchanter
  class.enchanter.desc: Talks the world into behaving differently.
  class.priest: Priest
  class.priest.desc: Mends the wounded and steadies the frightened.
  class.druid: Druid
  class.druid.desc: Reads the wild the way a clerk reads a ledger.

