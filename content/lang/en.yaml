  # Curated quests
  quest.rat_cellar: Clear the Rat Cellar
  quest.rat_cellar.desc: The tavern's cellar has gone from "squeaking" to "scurrying". Someone should do something about that.
  quest.lost_cat: Find the Miller's Cat
  quest.lost_cat.desc: The miller's cat has been missing since Tuesday. It has, reportedly, opinions about being found.
  quest.market_watch: Watch the Market Stalls
  quest.market_watch.desc: A pickpocket has been working the market square. Somebody ought to stand around looking useful.
  quest.bandit_toll: End the Bandit Toll
  quest.bandit_toll.desc: Bandits have been taxing the trade road. The guild disagrees with their arithmetic.
  quest.moonpetal: Gather Moonpetal
  quest.moonpetal.desc: The apothecary needs moonpetal, which only opens at dusk and only in places nobody sensible goes at dusk.
  quest.pilgrims: See the Pilgrims to Saint Aud's
  quest.pilgrims.desc: A party of pilgrims wants an escort to the shrine, and someone to hear the same hymn nine times.
  quest.goblin_camp: Break Up the Goblin Camp
  quest.goblin_camp.desc: A goblin band has settled too close to the north road for anyone's comfort.
  quest.smugglers_den: Raid the Smugglers' Den
  quest.smugglers_den.desc: Contraband is moving through the old quarry again. The guild has been asked to make it stop moving.
  quest.haunted_mill: Lay the Haunted Mill to Rest
  quest.haunted_mill.desc: Something in the old mill has not been paying rent, and the miller wants it evicted.
  quest.arcane_anomaly: Investigate the Arcane Anomaly
  quest.arcane_anomaly.desc: Lights over the marsh, compasses spinning, and a goat that now speaks Old Imperial.
  quest.salt_caravan: Escort the Salt Caravan
  quest.salt_caravan.desc: The salt road is long, the caravan is slow, and the hills have opinions about both.
  quest.flooded_tunnels: Scout the Flooded Tunnels
  quest.flooded_tunnels.desc: The old drainage tunnels flooded in spring. Something has been living in them since.
  quest.dragon_spur: Drive Off the Dragon Spur Wyrm
  quest.dragon_spur.desc: A young wyrm has taken up residence on Dragon Spur ridge. This is a D-rank problem, and it knows it.
  quest.bandit_camp: Clear the Bandit Camp
  quest.bandit_camp.desc: The bandits who used to collect tolls have built a palisade. The guild takes this personally.
  quest.ancient_ruins: Explore the Ancient Ruins
  quest.ancient_ruins.desc: The ruins under Greyfen opened after the landslide. Scholars want maps. Scholars always want maps.

