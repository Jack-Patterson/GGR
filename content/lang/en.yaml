  goal.title: The guild is Renowned
  goal.body: Your guild's name is known up and down the valley. That is the end of the demo's road — but the guild keeps running for as long as you like.
  goal.stats: "Day {0} · {1} quests won · {2} lost to the road · {3} hired · {4} built"
  goal.thanks: Thank you for playing.
  goal.keep_playing: Keep playing

  intro.title: Welcome, Guildmaster
  intro.body: You are not the hero. You hired them. Adventurers choose their own work from the Quest Board and go out to their fortunes or their deaths; you staff the desk, hire, promote, equip, and build the hall around them. Gold comes from quests that succeed. Renown comes from the same place, and is what makes the guild grow.
  intro.controls: Click to select, click again (or Enter) to inspect. WASD pans, Z/X turns, scroll zooms. Space pauses; 1-5 set the speed. B builds. Esc backs out of anything.
  intro.begin: Open the doors

  howto.controls: Controls
  howto.mouse: "Mouse: left-click selects, a second click inspects; right- or middle-drag turns the view; the wheel zooms."
  howto.1.title: The loop
  howto.1.body: Quests are posted to the board. Adventurers read it and take the hardest work they are ranked for, walk out of the door, and come back days later with gold and experience — or injured, or not at all. You never send anyone; you shape who is there to go.
  howto.2.title: Quests are itineraries
  howto.2.body: "A quest is a list of legs: travel, perhaps an encounter, the objective, and the road home. Each leg is a check: a d20 plus the adventurer's attribute plus their gear, skills and class, against a target. Only the objective decides success. A failed leg can injure, and on a bad day kill. Every quest's sheet shows exactly how each roll went."
  howto.3.title: The desk
  howto.3.body: Candidates arrive at the Guild Desk and wait a day. Hiring and promotion need a clerk on shift at the desk; a guild with no clerk at all is signed for by you. Applicants include staff — clerks, cooks and medics.
  howto.4.title: Staff and shifts
  howto.4.body: Staff work one shift a day, chosen as a length and a start hour. Long shifts and night hours cost happiness; happy staff work faster, unhappy ones eventually quit. Wages are paid at midnight. Every reason for a mood is on their sheet.
  howto.5.title: Food and rest
  howto.5.body: Adventurers get hungry in the hall. A staffed canteen feeds them for a few coins; well-fed adventurers travel better, starving ones worse. Injured adventurers recover over time, and much faster in a staffed infirmary.
  howto.6.title: Growing adventurers
  howto.6.body: Skills grow on quests and at training dummies, faster in branches the adventurer has an aptitude for. Give them an aspiration and they will train toward it and change class when ready. Experienced adventurers ask for promotion at the desk; promotion lifts every attribute and opens harder work.
  howto.7.title: Gear
  howto.7.body: Loot and the outfitter's wares go into the guild's stash. Equip them from a character's sheet. Gear, skill and class bonuses together are capped by rank, so equipment helps but never replaces experience.
  howto.8.title: Building
  howto.8.body: Build mode places furniture and rooms. Construction takes gold up front and some hours of work. Nothing may block the door or cut anything off from it. Demolishing returns half the cost. With enough renown you can open the East Wing.
  howto.9.title: Renown
  howto.9.body: Renown rises with every success (more for harder ranks) and falls with every death. Each tier unlocks buildings, better applicants and faster work on the board. Reach Renowned to finish the demo's road.
