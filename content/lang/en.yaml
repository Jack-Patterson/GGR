  # Objectives (nudges, never gates)
  objective.hire: Hire an adventurer
  objective.hire.hint: Candidates wait at the Guild Desk. Hiring needs a clerk on shift.
  objective.return: See a quest come home
  objective.return.hint: Adventurers choose their own work at the Quest Board. Speed time up and wait.
  objective.canteen: Build a canteen
  objective.canteen.hint: Hungry adventurers do worse on the road. Open Build (B) and place a Canteen.
  objective.cook: Hire a cook
  objective.cook.hint: A canteen serves nobody without a cook. Staff applicants come to the desk too.
  objective.shift: Set somebody's shift
  objective.shift.hint: Open a staff member's sheet and choose their hours. Nights cost happiness.
  objective.equip: Equip an adventurer
  objective.equip.hint: Loot and outfitter purchases go to the stash. Equip from the character sheet.
  objective.aspire: Choose an aspiration
  objective.aspire.hint: Pick a class for an adventurer to work toward. Training dummies help.
  objective.promote: Promote an adventurer
  objective.promote.hint: Experienced adventurers ask for promotion at the desk. It costs a fee.
  objective.east_wing: Open the East Wing
  objective.east_wing.hint: A better-known guild can buy the East Wing and build more.
  objective.renowned: Become Renowned
  objective.renowned.hint: Successful quests earn renown. Deaths cost it.
