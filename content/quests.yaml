# Quests. The curated pool is GuildGameV2's eight starter templates verbatim plus seven written
# for the demo (two after GuildGame V1's authored quests). A quest is a flat itinerary of legs;
# exactly one objective, which alone decides success; the last leg is the return.
# Targets follow the ladder: objective = target_base, encounter -2, travel -3, return -4, +-1.

curated:
