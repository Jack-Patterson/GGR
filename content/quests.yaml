# Procedural quests: V1's "{objective} {target}" generator, rebuilt on V2's itinerary. Each
# category fixes the leg kinds and the attribute each checks; targets come off the rank ladder,
# rewards off the rank's gold range.
procedural:
  locations: [loc.river, loc.mines, loc.east_gate, loc.whispering_woods, loc.cliffs, loc.tunnels]
  categories:
    - id: eliminate
      verb_key: proc.eliminate
      targets: [target.bandits, target.wolves, target.forest_spirits]
      legs: [[travel, vitality], [encounter, perception], [objective, might], [return, agility]]
    - id: escort
      verb_key: proc.escort
      targets: [target.merchant, target.caravan, target.scholar]
      legs: [[travel, vitality], [objective, presence], [return, agility]]
    - id: gather
      verb_key: proc.gather
      targets: [target.herbs, target.mushrooms, target.ore]
      legs: [[travel, agility], [objective, perception], [return, vitality]]
    - id: investigate
      verb_key: proc.investigate
      targets: [target.ruins, target.lights, target.disappearances]
      legs: [[travel, vitality], [encounter, perception], [objective, arcana], [return, perception]]
    - id: scout
      verb_key: proc.scout
      targets: [target.pass, target.camp, target.ford]
      legs: [[travel, agility], [objective, perception], [return, agility]]
